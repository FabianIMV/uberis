name: EAS Update

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    name: EAS Update — Synthetic Life
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: synthetic_life/mobile/package-lock.json

      - name: Install dependencies
        working-directory: synthetic_life/mobile
        run: npm ci

      - name: Publish EAS Update
        working-directory: synthetic_life/mobile
        env:
          # Add these two secrets in GitHub → Settings → Secrets → Actions:
          #   EXPO_TOKEN     → your Expo access token (expo.dev → Account → Access Tokens)
          #   ANTHROPIC_API_KEY → your Anthropic key (sk-ant-...)
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Pasado por env (no interpolado en el script) para que comillas,
          # paréntesis o saltos de línea del commit no rompan el shell.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual trigger' }}
        run: |
          MSG="Deploy: $(printf '%s' "$COMMIT_MESSAGE" | head -n 1)"
          npx eas-cli@latest update \
            --branch main \
            --platform ios \
            --message "$MSG" \
            --non-interactive
