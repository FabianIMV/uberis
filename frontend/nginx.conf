server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /entities {
        proxy_pass http://backend:8000;
    }

    location /world {
        proxy_pass http://backend:8000;
    }

    location /lineage {
        proxy_pass http://backend:8000;
    }

    location /stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
